services:
  relaysend-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: relaysend-server:local
    container_name: relaysend-server
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      ROOM_MODE: global
      MAX_CONNECTIONS_PER_IP: "20"
      MAX_REQUESTS_PER_IP_PER_HOUR: "1000"
      SHARE_TTL_HOURS: "24"
      MIN_SHARE_TTL_MINUTES: "5"
      MAX_SHARE_TTL_HOURS: "168"
      MAX_SHARE_SIZE_MB: "100"
      MAX_SHARE_FILES: "20"
      MAX_SHARE_UPLOADS_PER_IP_PER_HOUR: "100"
      SHARE_DATA_DIR: /data/shares
      SHARE_AUTH_USERS: ${SHARE_AUTH_USERS:-}
      SHARE_AUTH_USERNAME: ${SHARE_AUTH_USERNAME:-}
      SHARE_AUTH_PASSWORD: ${SHARE_AUTH_PASSWORD:-}
      SERVER_PORT: "18080"
    volumes:
      - relaysend-share-data:/data/shares

  coturn:
    image: coturn/coturn:4.6.3
    container_name: relaysend-coturn
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_REALM: ${TURN_REALM:-relay.example.com}
      TURN_USER: ${TURN_USER:-relay}
      TURN_PASSWORD: ${TURN_PASSWORD:-change-me-before-use}
    command: >
      -n
      --log-file=stdout
      --realm=${TURN_REALM:-relay.example.com}
      --server-name=${TURN_REALM:-relay.example.com}
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USER:-relay}:${TURN_PASSWORD:-change-me-before-use}
      --no-cli
      --no-multicast-peers

volumes:
  relaysend-share-data:
